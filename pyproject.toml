[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pads"
version = "0.3.0"
description = "PADS — ICU mortality and discharge prediction pipeline (LSTM)."
readme = "README.md"
# Capped below 3.14: TensorFlow only ships wheels up to cp313 (no 3.14 build yet).
requires-python = ">=3.10,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "Julen Berrueta" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14",          # parquet engine for pandas.read_parquet
    "openpyxl>=3.1",        # .xlsx engine for pandas.read_excel
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "joblib>=1.3",
    "tqdm>=4.65",
    # TensorFlow: GPU build on Linux (incl. WSL2), CPU-only build on Windows.
    "tensorflow>=2.15; sys_platform == 'win32'",
    "tensorflow[and-cuda]>=2.15; sys_platform == 'linux'",
    "pydantic>=2.5",
    "tensorboard>=2.20.0",
    "mlflow>=2.10",         # tracking is opt-in at runtime (no-op without MLFLOW_TRACKING_URI)
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "mypy>=1.8",
    "reportlab>=4.5.1",
    "markdown>=3.10.2",
]
# Web app (training frontend). Install with: uv sync --extra app
app = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",  # multipart/form-data parsing for file uploads
]

[project.scripts]
pads = "pads.cli:main"
pads-app = "pads_app.main:run"

[tool.setuptools.packages.find]
include = ["pads*", "pads_app*"]
exclude = ["notebooks*", "tests*", "scripts*"]

[tool.setuptools.package-data]
pads_app = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: marks tests that take >30s (deselect with '-m \"not slow\"')",
    "e2e: end-to-end pipeline tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["notebooks/", "scripts/"]
